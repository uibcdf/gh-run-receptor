# Maintainer-authorized 1.5.0 delivery after #78 through #83, 2026-11-11.
# Actual source/installed gates and unchanged-file promotion remain mandatory.
schema = "molsyssuite.conda-plan@1"
package = "gh-run-receptor"
version = "1.5.0"
build_number = 0
route = "staged"
profile = "noarch-python"
reason = "Deliver source-preserving acquisition diagnostics, terminal-step consistency warnings, hosted-runner hints and reviewed dependency/publisher adoption from #78 through #83 as 1.5.0. Qualify one original noarch archive on twelve native installed cells before unchanged-byte public promotion; preserve historical releases."
decision_by = "Repository maintainer via Codex, 2026-11-11: attend all six open issues, then publish a new version. Selected minor 1.5.0/build 0; exact-source, exact-file installed and independent public gates remain required under #84."
artifact_subdirs = ["noarch"]
test_platforms = ["linux-64", "osx-arm64", "win-64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
required_workflows = [".github/workflows/python-routine.yml", ".github/workflows/compatibility.yml", ".github/workflows/molsyssuite-policy.yml", ".github/workflows/validate-contracts.yml", ".github/workflows/docs.yml", ".github/workflows/conda-policy.yml"]
requires_installed_gate = true
new_compatibility_surface = true
coupled_release = false
dependencies_public = true

[gate_jobs.".github/workflows/python-routine.yml"]
"Linux Python 3.14" = ["Check distribution inputs", "Run the complete package suite"]

[gate_jobs.".github/workflows/compatibility.yml"]
