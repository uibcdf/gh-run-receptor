import_name = "gh_run_receptor"
version_file = "site-packages/gh_run_receptor/_version.py"
reason = "Pure Python CLI with frozen JSON schemas; gh is a separately solved native executable, never a bundled payload."
external_run_requirements = ["gh>=2.48.0"]
external_run_reason = "Network acquisition uses the existing GitHub adapter and its minimum gh version. Offline replay remains independent of gh."
required_paths = [
  "site-packages/gh_run_receptor/__init__.py",
  "site-packages/gh_run_receptor/__main__.py",
  "site-packages/gh_run_receptor/_version.py",
  "site-packages/gh_run_receptor/cli.py",
  "site-packages/gh_run_receptor/github.py",
  "site-packages/gh_run_receptor/source_version.py",
  "site-packages/gh_run_receptor/contracts.py",
  "site-packages/gh_run_receptor/schemas/aggregate-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/bundle-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/comparison-policy-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/comparison-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/config-capture-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/config-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/events-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/model-v1.schema.json",
  "site-packages/gh_run_receptor/schemas/report-v1.schema.json",
]

[installed_gate]
workflow = ".github/workflows/test-staged-conda.yml"
platforms = ["linux-64", "osx-arm64", "win-64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
prepare_job = "installed / prepare"
job_template = "installed / {platform} · Python {python}"
required_steps = ["Install exact artifact", "Validate installed files", "Run installed tests", "Recheck installed provenance after scientific tests"]

[installed_tests]
paths = ["tests"]
pytest_args = ["--receptor=ci", "--deselect=tests/test_source_version.py::test_repository_checkout_has_a_source_version", "--deselect=tests/test_source_version.py::test_source_launcher_does_not_borrow_installed_distribution_version"]
conda_dependencies = ["jsonschema>=4.23,<5"]

