"ubuntu-latest · Python 3.14" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"macos-latest · Python 3.11" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"macos-latest · Python 3.12" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"macos-latest · Python 3.13" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"macos-latest · Python 3.14" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"windows-latest · Python 3.11" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
"windows-latest · Python 3.12" = ["Check distribution inputs", "Run the complete local suite", "Build wheel and source distribution", "Verify and install the wheel", "Smoke test the installed command outside the checkout"]
