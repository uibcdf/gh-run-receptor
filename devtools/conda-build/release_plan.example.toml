[gate_jobs.".github/workflows/molsyssuite-policy.yml"]
"policy / conformance" = ["Check repository conformance", "Check Python lint and imports", "Check Python formatting"]

[gate_jobs.".github/workflows/validate-contracts.yml"]
"validate" = ["Compare registered contracts with published baselines"]

[gate_jobs.".github/workflows/docs.yml"]
"build-docs" = ["Build strict HTML documentation"]

[gate_jobs.".github/workflows/conda-policy.yml"]
"policy / check" = ["Check publication workflow controls", "Check declared noarch recipe and resources without building"]
