name: Validate multi-run aggregation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: validate-multi-run-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Aggregate two public runs from different repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/aggregate.json"
          compact="$RUNNER_TEMP/aggregate.txt"
          sources=(
            "https://github.com/uibcdf/molsysmt/actions/runs/35196968944"
            "https://github.com/uibcdf/gh-run-receptor/actions/runs/35194479266"
          )
          python -m gh_run_receptor.cli aggregate "${sources[@]}" \
            --capture metadata --format json > "$report"
          python -m gh_run_receptor.cli aggregate "${sources[@]}" \
            --capture metadata --receptor llm > "$compact"
          python -c "import json, pathlib; path=pathlib.Path('$report'); value=json.loads(path.read_text()); assert value['schema'] == 'gh-run-receptor.aggregate@1'; assert value['assessment'] == 'PASS'; assert value['evidence_sufficient'] is True; assert value['source_count'] == 2; assert value['totals'] == {'jobs': 5, 'artifacts': 5}; assert value['summary']['repository_counts'] == {'uibcdf/gh-run-receptor': 1, 'uibcdf/molsysmt': 1}; assert {item['conclusion'] for item in value['sources']} == {'success'}"
          python -c "import pathlib; text=pathlib.Path('$compact').read_text(); assert text.startswith('PASS aggregate sources=2'); assert len(text.splitlines()) == 3; assert len(text.encode()) < 2000"

      - name: Preserve a real failure in a mixed collection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/aggregate-failure.json"
          set +e
          python -m gh_run_receptor.cli aggregate \
            "https://github.com/uibcdf/molsysmt/actions/runs/35196968944" \
            "https://github.com/uibcdf/molsysviewer/actions/runs/34890243748" \
            --capture metadata --format json > "$report"
          status="$?"
          set -e
          test "$status" -eq 1
          python -c "import json, pathlib; value=json.loads(pathlib.Path('$report').read_text()); assert value['assessment'] == 'FAIL'; assert value['evidence_sufficient'] is True; assert value['totals'] == {'jobs': 9, 'artifacts': 2}; assert value['summary']['assessment_counts'] == {'FAIL': 1, 'PASS': 1}; assert {item['conclusion'] for item in value['sources']} == {'failure', 'success'}"
