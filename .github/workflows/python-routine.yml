name: Python routine tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out the reviewed distribution SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uibcdf/molsyssuite
          ref: 38db709ecc07451ff36ea84573d585f9af6b4df7
          path: .molsyssuite
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install package and test tools
        run: python -m pip install ".[test]" "coverage==7.16.0"
      - name: Check distribution inputs
        run: python devtools/check_distribution_inputs.py --suite-root .molsyssuite

      - name: Run the complete package suite
        run: |
          python -m coverage run --branch --source=gh_run_receptor -m pytest --receptor=ci
          python -m coverage xml -o coverage.xml
      - name: Retain the measured coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  coverage-upload:
    name: Publish default-branch coverage
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: coverage-report
      - name: Upload the measured report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-report/coverage.xml
          disable_search: true
          fail_ci_if_error: true
