name: Python routine tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: python -m pip install ".[test]"
      - name: Run the complete package suite
        run: python -m pytest --receptor=ci
