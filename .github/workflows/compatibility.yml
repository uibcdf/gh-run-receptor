name: Cross-platform compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test and build tools
        run: python -m pip install build ".[test]"

      - name: Run the complete local suite
        run: python -m pytest --receptor=llm

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify and install the wheel
        run: |
          python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); sdists=list(Path('dist').glob('*.tar.gz')); assert len(wheels) == len(sdists) == 1, (wheels, sdists); print(wheels[0], sdists[0])"
          python -c "from pathlib import Path; import subprocess, sys; wheel=next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"

      - name: Smoke test the installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          gh-run-receptor --version
          python -c "from importlib.metadata import version; value=version('gh-run-receptor'); assert value != '0+unknown', value; print(value)"
