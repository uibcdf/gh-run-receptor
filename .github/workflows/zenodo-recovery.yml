name: Resumable Zenodo archival verification

on:
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact public release tag; leave empty to discover covered releases
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: uibcdf/molsyssuite/.github/workflows/verify-zenodo-releases.yaml@6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
    with:
      concept-doi: "10.5281/zenodo.22843377"
      since: "2026-10-24T00:00:00Z"
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || '' }}
