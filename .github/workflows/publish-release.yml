name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact X.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Verify exact tag identity
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must use X.Y.Z without a prefix: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

      - name: Install test and build tools
        run: python -m pip install build ".[test]"

      - name: Validate release metadata and tests
        run: |
          python devtools/scripts/release_tools.py citation "$RELEASE_TAG"
          python devtools/scripts/validate_contracts.py --baseline 0.19.0
          python -m pytest --receptor=llm

      - name: Build and verify distributions
        shell: bash
        run: |
          python -m build
          python devtools/scripts/release_tools.py manifest "$RELEASE_TAG"
          python -m pip install --no-deps --target "$RUNNER_TEMP/install" \
            "dist/gh_run_receptor-${RELEASE_TAG}-py3-none-any.whl"
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$RUNNER_TEMP/install" python -c \
              "import gh_run_receptor; assert gh_run_receptor.__version__ == '$RELEASE_TAG'; assert gh_run_receptor.__file__.startswith('$RUNNER_TEMP/install/')"
          )
          python devtools/scripts/release_tools.py notes "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create and verify the draft release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json databaseId --jq .databaseId)
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            printf 'Draft release ID is not numeric: %s\n' "$release_id" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/tag.json"
          python devtools/scripts/release_tools.py verify "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --release-json "$RUNNER_TEMP/release.json" \
            --tag-json "$RUNNER_TEMP/tag.json" --state draft

      - name: Publish and verify the public release
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json"
          python devtools/scripts/release_tools.py verify "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --release-json "$RUNNER_TEMP/release.json" \
            --tag-json "$RUNNER_TEMP/tag.json" --state published
