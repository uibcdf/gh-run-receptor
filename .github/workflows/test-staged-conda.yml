name: Test one installed staged Conda archive
run-name: Installed ${{ inputs.filename }} ${{ inputs.sha256 }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full original producer SHA; workflow ref may contain a reviewed administrative correction
        required: true
        type: string
      filename:
        description: Exact staged noarch archive filename
        required: true
        type: string
      sha256:
        description: SHA-256 recorded by the producer
        required: true
        type: string
permissions:
  contents: read
jobs:
  installed:
    uses: uibcdf/molsyssuite/.github/workflows/test-installed-noarch-conda.yaml@6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      filename: ${{ inputs.filename }}
      sha256: ${{ inputs.sha256 }}
