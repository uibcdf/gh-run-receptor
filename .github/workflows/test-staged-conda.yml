name: Test one installed staged Conda archive
run-name: Installed ${{ inputs.filename }} ${{ inputs.sha256 }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full original producer SHA; administrative workflow identity remains separate
        required: true
        type: string
      filename:
        description: Exact original staged archive filename
        required: true
        type: string
      sha256:
        description: Original producer SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    name: installed / prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      package: ${{ steps.prepare.outputs.package }}
      version: ${{ steps.prepare.outputs.version }}
      build_number: ${{ steps.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: component
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: uibcdf/molsyssuite
          ref: 6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
          path: .molsyssuite
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML>=6,<7' 'Jinja2>=3,<4' 'packaging>=24'
      - name: Bind exact file, source and complete installed matrix
        id: prepare
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FILENAME: ${{ inputs.filename }}
          SHA256: ${{ inputs.sha256 }}
          QUALIFICATION_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python .molsyssuite/devtools/scripts/installed_noarch.py prepare --root component \
            --candidate-sha "$CANDIDATE_SHA" --filename "$FILENAME" --sha256 "$SHA256" --github-output "$GITHUB_OUTPUT" \
            --qualification-sha "$QUALIFICATION_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/installed-source-binding.json"
      - uses: actions/upload-artifact@v4
        with:
          name: installed-source-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-source-binding.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-noarch-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
          path: component/devtools/conda-build/*.toml
  installed:
    needs: prepare
    name: installed / ${{ matrix.platform }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: component
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: uibcdf/molsyssuite
          ref: 6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
          path: .molsyssuite
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: qualification
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          activate-environment: installed
          auto-activate-base: false
          python-version: ${{ matrix.python }}
          channels: uibcdf,conda-forge
          channel-priority: strict
          run-init: "false"
          remove-profiles: "false"
      - name: Bootstrap qualification checks
        env:
          PYTHON_MINOR: ${{ matrix.python }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          conda install --yes --override-channels --strict-channel-priority -c uibcdf -c conda-forge \
            "python=$PYTHON_MINOR" 'pyyaml>=6,<7' 'jinja2>=3,<4' 'packaging>=24'
      - name: Repair Windows installer launcher metadata
        if: runner.os == 'Windows'
        env:
          CONDA_SAFETY_CHECKS: enabled
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          conda install --yes --name base --force-reinstall --override-channels \
            --strict-channel-priority -c conda-forge conda-launchers
      - name: Install committed qualification tools
        env:
          PYTHON_MINOR: ${{ matrix.python }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python .molsyssuite/devtools/scripts/installed_noarch.py tools --root component \
            --python "$PYTHON_MINOR" --output "$RUNNER_TEMP/installed-test-tools.json"
      - name: Install exact artifact
        env:
          SHA256: ${{ inputs.sha256 }}
          PACKAGE: ${{ needs.prepare.outputs.package }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
          FILENAME: ${{ inputs.filename }}
          PYTHON_MINOR: ${{ matrix.python }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python .molsyssuite/devtools/scripts/installed_noarch.py download --root component \
            --sha256 "$SHA256" --directory "$RUNNER_TEMP/noarch-artifact"
          python .molsyssuite/devtools/scripts/installed_noarch.py install --root component \
            --sha256 "$SHA256" --filename "$FILENAME" --python "$PYTHON_MINOR" \
            --directory "$RUNNER_TEMP/noarch-artifact"
      - name: Validate installed files
        working-directory: ${{ runner.temp }}
        env:
          COMPONENT_ROOT: ${{ github.workspace }}/component
          TOOL_ROOT: ${{ github.workspace }}/.molsyssuite
          FILENAME: ${{ inputs.filename }}
          SHA256: ${{ inputs.sha256 }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python "$TOOL_ROOT/devtools/scripts/installed_noarch.py" verify --root "$COMPONENT_ROOT" \
            --filename "$FILENAME" --sha256 "$SHA256" --directory "$RUNNER_TEMP/noarch-artifact" \
            --platform "$PLATFORM" --python "$PYTHON"
      - name: Run installed tests
        working-directory: ${{ runner.temp }}
        # Safe-path applies to the installed test interpreter; original source helpers
        # are bound explicitly without adding the component runtime source root.
        env:
          COMPONENT_ROOT: ${{ github.workspace }}/component
          TOOL_ROOT: ${{ github.workspace }}/.molsyssuite
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_ROOT: ${{ github.workspace }}/qualification
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python -P "$QUALIFICATION_ROOT/devtools/scripts/installed_test_helpers.py" \
          --root "$COMPONENT_ROOT" --suite-root "$TOOL_ROOT" \
          --candidate-sha "$CANDIDATE_SHA" --output "$RUNNER_TEMP/installed-admin-helpers.json"
      - name: Recheck installed provenance after scientific tests
        working-directory: ${{ runner.temp }}
        env:
          COMPONENT_ROOT: ${{ github.workspace }}/component
          TOOL_ROOT: ${{ github.workspace }}/.molsyssuite
          FILENAME: ${{ inputs.filename }}
          SHA256: ${{ inputs.sha256 }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python "$TOOL_ROOT/devtools/scripts/installed_noarch.py" verify --root "$COMPONENT_ROOT" \
            --filename "$FILENAME" --sha256 "$SHA256" --directory "$RUNNER_TEMP/noarch-artifact" \
            --platform "$PLATFORM" --python "$PYTHON"
      - name: Retain qualification tool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-test-tools-${{ matrix.platform }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/installed-test-tools.json
          if-no-files-found: warn
      - name: Retain administrative helper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-admin-helpers-${{ matrix.platform }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/installed-admin-helpers.json
          if-no-files-found: warn
          retention-days: 30
