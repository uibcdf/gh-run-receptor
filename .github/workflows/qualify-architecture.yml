name: Qualify separated runtime and portable tools
run-name: Nonpublishing architecture qualification
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Reuse this original private producer run instead of building
        type: string
        default: ''
      producer_attempt:
        description: Original producer attempt
        type: string
        default: '1'
      candidate_sha:
        description: Full original product and test/support source SHA when reusing
        type: string
        default: ''
      sha256:
        description: Original private file digest when reusing
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.producer_run_id == ''
    name: Build one private candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.file.outputs.sha256 }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: uibcdf/molsyssuite
          ref: fee3bd875e68778844c0fffc2aba26b6cea02cd6
          path: .molsyssuite
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          environment-file: .molsyssuite/devtools/conda-envs/noarch-publisher.yaml
          activate-environment: noarch-publisher
          auto-activate-base: false
          channels: uibcdf,conda-forge
          channel-priority: strict
          run-init: 'false'
          remove-profiles: 'false'
      - name: Review source and private qualification inputs
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate noarch-publisher
          python -m pip install --no-deps .
          python devtools/check_distribution_inputs.py --suite-root .molsyssuite
          python -m gh_run_receptor_tools.test_inventory --root .
          python .molsyssuite/devtools/scripts/noarch_conda.py --root . --plan devtools/conda-build/qualification_plan.toml
          command conda build --version
          python -c 'import sys; from pathlib import Path; print(Path(sys.prefix)/"bin")' >> "$GITHUB_PATH"
      - name: Freeze metadata only in the private build copy
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate noarch-publisher
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          shutil.copytree(Path.cwd(), Path(os.environ['RUNNER_TEMP'])/'candidate-source',
              ignore=shutil.ignore_patterns('.git','.molsyssuite','dist','build','*.egg-info','__pycache__','.pytest_cache','.ruff_cache'))
          PY
          python .molsyssuite/devtools/scripts/noarch_conda.py --root "$RUNNER_TEMP/candidate-source" \
            --plan devtools/conda-build/qualification_plan.toml --freeze-version
      - name: Build one nonpublishing Conda file
        id: compilation
        env:
          MOLSYSSUITE_CONDA_VERSION: '0.0.0'
          MOLSYSSUITE_CONDA_BUILD_NUMBER: '76'
        uses: uibcdf/action-build-and-upload-conda-packages@8da628d9b393e184c3bf3722708b19dcfbf7ef0a
        with:
          meta_yaml_dir: ${{ runner.temp }}/candidate-source/devtools/conda-build
          upload: false
          github_release: false
          platform_host: true
          platform_all: false
          conda_build_args: --package-format 1
      - name: Inspect exact original private file
        id: file
        env:
          BUILT_PATHS: ${{ steps.compilation.outputs.built_paths }}
          SOURCE_SHA: ${{ github.sha }}
          PROVIDER_SHA: fee3bd875e68778844c0fffc2aba26b6cea02cd6
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate noarch-publisher
          python .molsyssuite/devtools/scripts/noarch_conda.py --root . --plan devtools/conda-build/qualification_plan.toml \
            --built-paths "$BUILT_PATHS" \
            --output "$RUNNER_TEMP/private-producer.json" --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'private-producer.json'
          document=json.loads(path.read_text())
          document.update(product_source_sha=os.environ['SOURCE_SHA'],provider_sha=os.environ['PROVIDER_SHA'],
              qualification_sha=os.environ['SOURCE_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],public=False,
              plan_sha256=hashlib.sha256(Path('devtools/conda-build/qualification_plan.toml').read_bytes()).hexdigest())
          path.write_text(json.dumps(document,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.compilation.outputs.built_paths }}
            ${{ runner.temp }}/private-producer.json
          if-no-files-found: error
          retention-days: 30
  installed:
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.producer_run_id != ''))
    name: installed / ${{ matrix.platform }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-64, runner: ubuntu-latest, python: '3.11'}
          - {platform: linux-64, runner: ubuntu-latest, python: '3.12'}
          - {platform: linux-64, runner: ubuntu-latest, python: '3.13'}
          - {platform: linux-64, runner: ubuntu-latest, python: '3.14'}
          - {platform: osx-arm64, runner: macos-15, python: '3.11'}
          - {platform: osx-arm64, runner: macos-15, python: '3.12'}
          - {platform: osx-arm64, runner: macos-15, python: '3.13'}
          - {platform: osx-arm64, runner: macos-15, python: '3.14'}
          - {platform: win-64, runner: windows-latest, python: '3.11'}
          - {platform: win-64, runner: windows-latest, python: '3.12'}
          - {platform: win-64, runner: windows-latest, python: '3.13'}
          - {platform: win-64, runner: windows-latest, python: '3.14'}
    defaults:
      run:
        shell: bash -el {0}
    env:
      COMPONENT_ROOT: ${{ github.workspace }}/component
      TOOL_ROOT: ${{ github.workspace }}/.molsyssuite
      SHA256: ${{ needs.build.outputs.sha256 || inputs.sha256 }}
      PRODUCT_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id || github.run_id }}
      PRODUCER_ATTEMPT: ${{ inputs.producer_run_id && inputs.producer_attempt || github.run_attempt }}
      FILENAME: gh-run-receptor-0.0.0-py_76.tar.bz2
      PLATFORM: ${{ matrix.platform }}
      PYTHON_MINOR: ${{ matrix.python }}
      GH_RECEPTOR_SUITE_ROOT: ${{ github.workspace }}/.molsyssuite
      GHR_EXPECT_INSTALLED: '1'
      TEST_SUPPORT_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      TEST_SUPPORT_QUALIFICATION_SHA: ${{ github.sha }}
      TEST_SUPPORT_PROVIDER_SHA: fee3bd875e68778844c0fffc2aba26b6cea02cd6
      TEST_SUPPORT_FILENAME: gh-run-receptor-0.0.0-py_76.tar.bz2
      TEST_SUPPORT_SHA256: ${{ needs.build.outputs.sha256 || inputs.sha256 }}
      TEST_SUPPORT_RUN_ID: ${{ github.run_id }}
      TEST_SUPPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          path: component
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: uibcdf/molsyssuite
          ref: fee3bd875e68778844c0fffc2aba26b6cea02cd6
          path: .molsyssuite
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-candidate-${{ inputs.producer_run_id || github.run_id }}-${{ inputs.producer_run_id && inputs.producer_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.producer_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          activate-environment: installed
          auto-activate-base: false
          python-version: ${{ matrix.python }}
          channels: uibcdf,conda-forge
          channel-priority: strict
          run-init: 'false'
          remove-profiles: 'false'
      - name: Locate and bind the original private file
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'candidate'
          files=[p for p in root.rglob('*') if p.is_file()]
          if len(files)!=2 or any(p.is_symlink() for p in root.rglob('*')):
              raise ValueError('Private producer must contain exactly two regular files')
          manifests=[p for p in files if p.name=='private-producer.json']
          archives=[p for p in files if p.name==os.environ['FILENAME']]
          if len(manifests)!=1 or len(archives)!=1 or manifests[0].stat().st_size>65536:
              raise ValueError('Original private producer members differ')
          record=json.loads(manifests[0].read_text(encoding='utf-8'))
          expected={'filename':os.environ['FILENAME'],'sha256':os.environ['SHA256'],
              'product_source_sha':os.environ['PRODUCT_SOURCE_SHA'],
              'provider_sha':os.environ['TEST_SUPPORT_PROVIDER_SHA'],
              'run_id':os.environ['PRODUCER_RUN_ID'],
              'run_attempt':os.environ['PRODUCER_ATTEMPT'],
              'package':'gh-run-receptor','version':'0.0.0','build_number':76,'public':False}
          if not re.fullmatch('[0-9a-f]{40}',expected['product_source_sha']) or not re.fullmatch('[0-9a-f]{64}',expected['sha256']):
              raise ValueError('Original private identities must be full hashes')
          if any(record.get(k)!=v for k,v in expected.items()):
              raise ValueError('Original private producer binding differs')
          plan=Path(os.environ['COMPONENT_ROOT'])/'devtools/conda-build/qualification_plan.toml'
          if hashlib.sha256(plan.read_bytes()).hexdigest()!=record['plan_sha256']:
              raise ValueError('Original private plan changed')
          archive=archives[0]
          if archive.stat().st_size>64*1024*1024 or hashlib.sha256(archive.read_bytes()).hexdigest()!=expected['sha256']:
              raise ValueError('Original private file digest differs')
          target=root/expected['filename']
          if archive!=target:
              target.write_bytes(archive.read_bytes())
              archive.unlink()
          (Path(os.environ['RUNNER_TEMP'])/'original-private-producer.json').write_text(json.dumps(record,indent=2)+'\n')
          print('Verified original private source, run, plan and file digest')
          PY
      - name: Repair Windows installer launcher metadata
        if: runner.os == 'Windows'
        env:
          CONDA_SAFETY_CHECKS: enabled
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          conda install --yes --name base --force-reinstall --override-channels -c conda-forge conda-launchers
      - name: Install declared test tools
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          conda install --yes --override-channels --strict-channel-priority -c uibcdf -c conda-forge \
            'pyyaml>=6,<7' 'jinja2>=3,<4' 'packaging>=24'
          python "$TOOL_ROOT/devtools/scripts/installed_noarch.py" tools --root "$COMPONENT_ROOT" \
            --plan devtools/conda-build/qualification_plan.toml --python "$PYTHON_MINOR" --output "$RUNNER_TEMP/tools.json"
      - name: Install exact artifact
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python "$TOOL_ROOT/devtools/scripts/installed_noarch.py" install --root "$COMPONENT_ROOT" \
            --plan devtools/conda-build/qualification_plan.toml --local-file --filename "$FILENAME" \
            --sha256 "$SHA256" --python "$PYTHON_MINOR" --directory "$RUNNER_TEMP/candidate" \
            --output "$RUNNER_TEMP/installation.json"
      - name: Validate installed files
        working-directory: ${{ runner.temp }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python -P "$TOOL_ROOT/devtools/scripts/installed_noarch.py" verify --root "$COMPONENT_ROOT" \
            --plan devtools/conda-build/qualification_plan.toml --local-file --filename "$FILENAME" --sha256 "$SHA256" \
            --directory "$RUNNER_TEMP/candidate" --platform "$PLATFORM" --python "$PYTHON_MINOR" \
            --output "$RUNNER_TEMP/before.json"
      - name: Run installed tests
        working-directory: ${{ runner.temp }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python -P "$TOOL_ROOT/devtools/scripts/installed_noarch.py" tests --root "$COMPONENT_ROOT" \
            --plan devtools/conda-build/qualification_plan.toml --output "$RUNNER_TEMP/support.json"
      - name: Recheck installed provenance after scientific tests
        working-directory: ${{ runner.temp }}
        run: |
          source "$(cygpath -u "$CONDA" 2>/dev/null || echo "$CONDA")/etc/profile.d/conda.sh"
          conda activate installed
          python -P "$TOOL_ROOT/devtools/scripts/installed_noarch.py" verify --root "$COMPONENT_ROOT" \
            --plan devtools/conda-build/qualification_plan.toml --local-file --filename "$FILENAME" --sha256 "$SHA256" \
            --directory "$RUNNER_TEMP/candidate" --platform "$PLATFORM" --python "$PYTHON_MINOR" \
            --output "$RUNNER_TEMP/after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-${{ matrix.platform }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/original-private-producer.json
            ${{ runner.temp }}/tools.json
            ${{ runner.temp }}/installation.json
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/support.json
            ${{ runner.temp }}/after.json
          if-no-files-found: warn
          retention-days: 30
